name: Diagnostica fonti

# Solo a mano: scarica la pagina del certificato da diverse fonti e salva
# in debug/fonti/ cosa risponde ognuna, per scegliere quali usare.
on:
  workflow_dispatch: {}   # GitHub → Actions → Diagnostica fonti → Run workflow

permissions:
  contents: write

jobs:
  salva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica le pagine
        run: |
          mkdir -p debug/fonti
          ISIN=CH1453363652
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          get() {
            curl -sSL --compressed --max-time 40 -A "$UA" -H "Accept-Language: it-IT,it;q=0.9" \
              -o "debug/fonti/$1" -w "%{http_code} %{size_download}" "$2" > /tmp/esito 2>/dev/null || echo "errore" > /tmp/esito
            prezzo=$(grep -o -E '1[.,]?0[0-9]{2}[.,][0-9]{2}' "debug/fonti/$1" 2>/dev/null | head -3 | tr '\n' ' ')
            blocco=$(grep -l -i -E 'incapsula|captcha|cloudflare|access denied|forbidden' "debug/fonti/$1" >/dev/null 2>&1 && echo BLOCCO || echo "")
            echo "$1 | $(cat /tmp/esito) | $blocco | prezzi trovati: $prezzo | $2" | tee -a debug/fonti/elenco.txt
          }
          rm -f debug/fonti/elenco.txt
          BI="https://www.borsaitaliana.it/borsa/cw-e-certificates"
          get bi_dati_mercato.html "$BI/dati-mercato.html?isin=$ISIN&mic=SEDX&lang=it"
          get bi_contratti.html    "$BI/contratti.html?isin=$ISIN&mic=SEDX&lang=it"
          get bi_anagrafici.html   "$BI/dati-anagrafici.html?isin=$ISIN&mic=SEDX&lang=it"
          get bi_listino.html      "$BI/listino-ufficiale.html?isin=$ISIN&mic=SEDX&lang=it"
          get kid.html             "https://priipkidportal.com/isin/$ISIN/kid/it"
          grep -o -E 'href="[^"]*\.pdf[^"]*"' debug/fonti/kid.html | head -5 > debug/fonti/kid_link.txt || true
          # link e indirizzi dati dentro la pagina Leonteq
          grep -o -E '(src|href|data-[a-z-]+)="[^"]*(api|json|chart|price|quote)[^"]*"' debug/fonti/leonteq_it.html | head -40 > debug/fonti/leonteq_indirizzi.txt || true
          grep -o -E 'https?://[^"'"'"' ]*(api|json|chart|price|quote)[^"'"'"' ]*' debug/fonti/leonteq_it.html | sort -u | head -40 >> debug/fonti/leonteq_indirizzi.txt || true

      - name: Il browser può leggere i dati direttamente? (intestazioni CORS)
        run: |
          ISIN=CH1453363652
          ORIGINE="https://massimilianodilorenzo70-eng.github.io"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          cors() {
            echo "=== $1"
            echo "$2"
            curl -s -o /dev/null -D /tmp/h --max-time 40 -A "$UA" -H "Origin: $ORIGINE" "$2" || echo "errore di rete"
            grep -i -E '^(HTTP/|content-type:|access-control-[a-z-]+:|cache-control:|last-modified:|date:)' /tmp/h | tr -d '\r'
            grep -qi '^access-control-allow-origin:' /tmp/h && echo ">> CORS PRESENTE: il browser può leggere" || echo ">> nessun CORS: il browser NON può leggere da un altro sito"
          }
          BI="https://www.borsaitaliana.it/borsa/cw-e-certificates"
          cors "Borsa Italiana - Dati mercato" "$BI/dati-mercato.html?isin=$ISIN&mic=SEDX&lang=it"
          cors "Borsa Italiana - scheda" "$BI/scheda/$ISIN-SEDX.html?lang=it"
          cors "Euronext - pagina prodotto" "https://live.euronext.com/en/product/structured-products/$ISIN-SEDX"
          cors "Euronext - quotazione (ajax)" "https://live.euronext.com/en/ajax/getDetailedQuote/$ISIN-SEDX"
          cors "Euronext - grafico intraday (ajax)" "https://live.euronext.com/en/intraday_chart/getChartData/$ISIN-SEDX/max"

      - name: Salva la copia nel repository
        run: |
          git config user.name "vici-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug/fonti
          git diff --cached --quiet || git commit -m "Diagnostica fonti [bot]"
          git pull --rebase
          git push
